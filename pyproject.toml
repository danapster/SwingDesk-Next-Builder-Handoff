[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingdesk"
version = "0.1.0"
description = "Swing Desk — decision workstation for serious swing traders (demo-adapter build)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
mt5 = ["MetaTrader5"]  # Windows only; the app runs fully without it

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
