[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swingdesk"
version = "0.1.0"
description = "Swing Desk — live MetaTrader 5 swing-trading decision workstation"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "tzdata>=2024.1", "MetaTrader5>=5.0.6180; platform_system == \'Windows\'"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt"]
mt5 = ["MetaTrader5>=5.0.6180"]  # Windows only; included automatically on Windows

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
