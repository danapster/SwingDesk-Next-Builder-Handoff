<!doctype html>
<html lang="en" data-theme="obsidian"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Edge Ledger</title>
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root,[data-theme=obsidian]{--bg:#08090b;--wash:radial-gradient(circle at 80% -10%,#242019 0,#0b0c0f 35%,#08090b 70%);--p:#111318;--p2:#17191f;--in:#0a0b0e;--ln:#292c33;--tx:#ece9e2;--mu:#8d9098;--g:#c9a96a;--g2:#e3c88d;--gf:#b49359;--gt:#000;--w:#71c79a;--wb:#102019;--wl:#397353;--l:#df7777;--lb:#201112;--ll:#713b3b;--num:Inter,system-ui,sans-serif}
[data-theme=ivory]{--bg:#f7f3ec;--wash:none;--p:#efebe3;--p2:#e6e1d6;--in:#fbf9f4;--ln:#d6cfc1;--tx:#23211e;--mu:#6d685e;--g:#9c7a35;--g2:#7d5f22;--gf:#a8853d;--gt:#fff;--w:#3d8560;--wb:#e3efe7;--wl:#9cc5ae;--l:#b45555;--lb:#f3e2e0;--ll:#d9a7a3;--num:Inter,system-ui,sans-serif}
[data-theme=mono]{--bg:#000;--wash:none;--p:#0b0b0b;--p2:#161616;--in:#000;--ln:#333;--tx:#fff;--mu:#999;--g:#fff;--g2:#fff;--gf:#fff;--gt:#000;--w:#fff;--wb:#1c1c1c;--wl:#fff;--l:#aaa;--lb:#000;--ll:#666;--num:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg) var(--wash);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:235px;background:var(--in);border-right:1px solid var(--ln);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
main{margin-left:235px;padding:28px;max-width:1300px}
h1,h2,h3,.name{font-family:Georgia,serif;font-weight:400;margin:0}h1{font-size:30px}h3{font-size:17px;margin-bottom:10px}
.brand{position:relative;--a:0deg}
.brand::before,.brand::after{content:"";position:absolute;inset:-1px;border-radius:16px;background:conic-gradient(from var(--a),transparent 0 55%,var(--g) 80%,#fff6dc 92%,transparent);animation:orbit 4s linear infinite}
.brand::before{filter:blur(9px);opacity:.75;inset:-3px}
.brand::after{padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.bin{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--in);border-radius:15px}
.bin svg{flex:none}.name{font-size:18px;line-height:1.1;color:var(--tx)}.sub{font-size:11px;color:var(--mu);margin-top:2px}
@keyframes orbit{to{--a:360deg}}
@media(prefers-reduced-motion:reduce){.brand::before,.brand::after{animation:none}}
nav{display:flex;flex-direction:column;gap:3px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--mu)}nav button:hover,nav button.on{color:var(--g);background:var(--p2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:13px;padding:18px;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 10px;font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0}
.btn{cursor:pointer;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 14px;font:inherit}.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--gf);color:var(--gt);border-color:var(--gf);font-weight:600}.btn:disabled{opacity:.4;cursor:not-allowed}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.stat{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:12px}.stat small{color:var(--mu);font-size:11px}.stat b{display:block;font-size:22px;font-family:var(--num);font-weight:600}
.err{color:var(--l)}.mu{color:var(--mu)}
.pill{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--p);margin-bottom:8px;cursor:pointer}
.pill em{margin-left:auto;font-style:normal;font-weight:600}
.pill.wn{background:var(--wb);border-color:var(--wl)}.pill.wn em{color:var(--w)}.pill.ls{background:var(--lb);border-color:var(--ll)}.pill.ls em{color:var(--l)}.pill.op{border-style:dashed;border-color:var(--g)}.pill.op em{color:var(--g)}
.pill.ls{border-style:solid}.det{padding:14px;margin:-4px 0 10px;border:1px solid var(--ln);border-radius:12px;background:var(--p2)}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);text-align:left;font-weight:500}td,th{padding:9px 6px;border-bottom:1px solid var(--ln)}
.bar{height:6px;border-radius:3px;background:var(--w);min-width:2px}.bar.n{background:var(--l)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{font-size:11px;color:var(--mu);text-align:center}
.day{min-height:62px;border:1px solid var(--ln);border-radius:9px;padding:6px;font-size:12px;cursor:pointer;background:var(--p)}.day.sel{outline:2px solid var(--g)}
.day.w{background:var(--wb);border-color:var(--wl)}.day.l{background:var(--lb);border-color:var(--ll)}.day.o{border:1px dashed var(--g)}
.tabs{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}.tabs .btn.on{border-color:var(--g);color:var(--g)}
.hd{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:12px;flex-wrap:wrap}
#toast{position:fixed;bottom:20px;right:20px;background:var(--gf);color:var(--gt);padding:10px 16px;border-radius:9px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}#toast.on{opacity:1}
@media(max-width:820px){.side{position:static;width:auto;border:0;border-bottom:1px solid var(--ln)}nav{flex-direction:row;overflow-x:auto}main{margin:0;padding:16px}.g2,.g3{grid-template-columns:1fr}.g3.keep{grid-template-columns:repeat(2,1fr)}}
.mrow{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:end;margin-bottom:8px}.mrow label{margin:0}
@media(max-width:820px){.mrow{grid-template-columns:1fr}}
.pb{height:8px;border-radius:4px;background:var(--in);border:1px solid var(--ln);overflow:hidden}.pb i{display:block;height:100%;background:var(--g)}.pb.d i{background:var(--l)}
.locked .side,.locked main{display:none}#lock{display:none;min-height:100vh;place-items:center;padding:20px}.locked #lock{display:grid}
</style></head><body>
<aside class="side">
 <div class="brand"><div class="bin">
  <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0a0b0e" stroke="#c9a96a" stroke-opacity=".4"/><path d="M7 12h12M7 18h9" stroke="#c9a96a" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/><path d="M7 31h7v-6h6v3h6v-9h7" fill="none" stroke="#e3c88d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <div><div class="name">The Edge Ledger</div><div class="sub">Plan it. Log it. Prove it.</div></div>
 </div></div>
 <nav id="nav"></nav>
</aside>
<div id="lock"><div style="max-width:380px;width:100%"><div id="lb" style="margin-bottom:22px"></div><div class="card"><h3>Unlock The Edge Ledger</h3><p class="mu">Enter the license key you received.</p><label>License key<input id="lk" placeholder="EDGE-XXXX-XXXX-XXXX" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()"></label><button class="btn pri" onclick="unlock()">Unlock</button><p id="lm" class="err"></p></div></div></div>
<main id="main"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INS=[['EURUSD',.0001,'u',10],['GBPUSD',.0001,'u',10],['AUDUSD',.0001,'u',10],['NZDUSD',.0001,'u',10],['USDJPY',.01,'jpy',1000],['USDCHF',.0001,'chf',10],['USDCAD',.0001,'cad',10],['EURJPY',.01,'jpy',1000],['GBPJPY',.01,'jpy',1000],['XAUUSD',.01,'u',1],['XAGUSD',.01,'u',50],['US30',1,'u',1],['NAS100',1,'u',1],['SPX500',1,'u',1],['GER40',1,'eur',1],['BTCUSD',1,'u',1],['ETHUSD',1,'u',1]];
const pv=i=>{if(S.pv[i[0]])return S.pv[i[0]];const r=S.rates;return i[2]==='jpy'?i[3]/r.USDJPY:i[2]==='chf'?i[3]/r.USDCHF:i[2]==='cad'?i[3]/r.USDCAD:i[2]==='eur'?i[3]*r.EURUSD:i[3]};
const DM=[['crt1','CRT — Model 1 (CISD)','TBS + first thick orderblock candle confirmation on LTF'],['crt2','CRT — Model 2 (MSS)','Market structure shift confirmation on LTF after TBS'],['crtb','CRT Bonus Model','Liquidity grab → MSS + opposite FVG entry'],['wcrt','Weekly CRT Model','Monday range, Tuesday purge, Wed–Fri continuation'],['ts','Turtle Soup (TS)','Liquidity sweep reversal'],['tbs','Turtle Body Soup (TBS)','Body-close manipulation of old high/low'],['kod','Kiss of Death (KOD)','LTF confirmation type'],['ote','OTE','Fib retracement entry after MSS'],['r3','R3 Playbook','Range–Raid–Run key-level model']];
const SN={asian:'Asian',london:'London',overlap:'Overlap',newyork:'New York'},DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const def=()=>({trades:[],models:[],theme:'obsidian',risk:.5,bal:10000,pv:{},rates:{USDJPY:150,USDCHF:.85,USDCAD:1.38,EURUSD:1.1},accounts:[],alerts:[],feed:{url:'ws://localhost:8765',off:2},seeded:false});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('edgeledger')))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('edgeledger',JSON.stringify(S))}catch(e){toast('Storage is full. Create a backup and remove old screenshots.',5000)}};
if(!S.seeded){S.models=DM.map(m=>({id:m[0],name:m[1],desc:m[2]})).concat(S.models);S.seeded=true;save()}
let FL={m:'',s:'',r:''},page='planner',jv='pills',X=null,sel=null,cm=new Date(),P={sym:'EURUSD',model:'crt1',entry:'',sl:'',tp:'',risk:S.risk},reset=false;
const models=()=>S.models,mname=id=>(models().find(m=>m.id===id)||{name:'Removed model'}).name;
const fr=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'R',dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function sess(ts){const h=new Date(ts).getUTCHours();return h>=12&&h<16?'overlap':h>=7&&h<12?'london':h>=16&&h<21?'newyork':'asian'}
function calc(p){const i=INS.find(x=>x[0]===p.sym);if(!i)return{err:'Pick an instrument from the list.'};const e=+p.entry,s=+p.sl,t=+p.tp;if(!(e&&s&&t))return null;if(e===s)return{err:'Stop loss can’t equal entry.'};
 const dir=s<e?'long':'short';if(dir==='long'?t<=e:t>=e)return{err:'Take profit must sit on the opposite side of entry from the stop.'};
 const pips=Math.abs(e-s)/i[1],rr=Math.abs(t-e)/Math.abs(e-s),rp=+p.risk||0,ab=p.acc&&AI(p.acc),usd=(ab?ab.bal:S.bal)*rp/100;return{dir,pips,rr,usd,lot:usd/(pips*pv(i)),ts:Date.now()}}
const closed=()=>S.trades.filter(t=>t.status==='closed');
function stats(l){const n=l.length;if(!n)return null;const tot=l.reduce((a,t)=>a+t.r,0);return{n,wr:l.filter(t=>t.r>0).length/n*100,rr:l.reduce((a,t)=>a+t.rr,0)/n,exp:tot/n,tot}}
function tbl(title,groups){const rows=groups.map(g=>[g[0],stats(g[1])]),mx=Math.max(1,...rows.map(r=>r[1]?Math.abs(r[1].tot):0));
 return `<div class="card"><h3>${title}</h3><div style="overflow-x:auto"><table><tr><th>Group<th>Trades<th>Win rate<th>Avg RR<th>Expectancy<th>Total R<th style="width:20%"></tr>`+rows.map(([k,s])=>s?`<tr><td>${esc(k)}<td class="num">${s.n}<td class="num">${s.wr.toFixed(0)}%<td class="num">${s.rr.toFixed(2)}<td class="num">${fr(s.exp)}<td class="num">${fr(s.tot)}<td><div class="bar ${s.tot<0?'n':''}" style="width:${Math.abs(s.tot)/mx*100}%"></div>`:`<tr><td>${esc(k)}<td colspan="6" class="mu">No closed trades`).join('')+`</table></div></div>`}
function outHTML(){const c=calc(P);if(!c)return'<p class="mu">Enter entry, stop loss and take profit. Direction, RR, lot size and session fill in on their own.</p>';if(c.err)return`<p class="err">${c.err}</p>`;
 const st=(a,b)=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`;
 return`<div class="g3 keep">${st('Direction',c.dir)}${st('Planned RR','1 : '+c.rr.toFixed(2))}${st('Suggested lots',c.lot.toFixed(2))}${st('Risk $','$'+c.usd.toFixed(2))}${st('Stop (pips)',c.pips.toFixed(1))}${st('Session',SN[sess(c.ts)])}</div>${acb(c)}<p class="mu">${DN[new Date().getDay()]} · auto-tagged from your device clock</p><button class="btn pri" onclick="send()">Send to Journal</button>`}
function U(){P={acc:$('#f-acc').value,sym:$('#f-sym').value.toUpperCase().trim(),model:$('#f-model').value,entry:$('#f-entry').value,sl:$('#f-sl').value,tp:$('#f-tp').value,risk:$('#f-risk').value};$('#out').innerHTML=outHTML()}
function send(){const c=calc(P);if(!c||c.err)return;S.trades.push({id:'t'+Date.now(),ts:c.ts,sym:P.sym,model:P.model,dir:c.dir,entry:+P.entry,sl:+P.sl,tp:+P.tp,risk:+P.risk,rr:c.rr,lot:c.lot,acc:P.acc||'',usd:c.usd,ok:(P.acc&&AI(P.acc))?verdict(P.acc,c.usd).ok:null,session:sess(c.ts),dow:new Date(c.ts).getDay(),status:'open',result:null,r:null,note:''});P.entry=P.sl=P.tp='';save();page='journal';render();toast('Sent to Journal as pending')}
function pill(t){const cls=t.status==='open'?'op':t.r>0?'wn':t.r<0?'ls':'',open=X===t.id;
 let h=`<div class="pill ${cls}" onclick="tg('${t.id}')"><b>${t.sym}</b><span>${esc(mname(t.model))}</span><span class="mu">${t.dir} · ${SN[t.session]} · ${DN[t.dow]}</span><em class="num">${t.status==='open'?'Pending — finalize':fr(t.r)}</em></div>`;
 if(open)h+=`<div class="det"><p class="num">Entry ${t.entry} · SL ${t.sl} · TP ${t.tp} · RR ${t.rr.toFixed(2)} · ${t.lot.toFixed(2)} lots · risk ${t.risk}%${t.acc&&AI(t.acc)?' · '+esc(AI(t.acc).a.label)+(t.ok===false?' · planned outside drawdown room':''):''}</p>`+(t.status==='open'?`<div class="g3"><label>Result<select id="r-res"><option value="win">Win</option><option value="loss">Loss</option><option value="be">Break even</option></select></label><label>Exact R (optional)<input id="r-r" type="number" step="0.01"></label><label>Note<input id="r-note"></label><label>Screenshots (up to 3)<input id="r-img" type="file" accept="image/*" multiple></label></div><button class="btn pri" onclick="fin('${t.id}')">Close trade</button>`:`<p>${esc(t.note)||'<span class="mu">No note.</span>'}</p>${(t.shots||[]).map(s=>`<img src="${s}" alt="Trade screenshot" style="max-width:100%;border-radius:9px;margin-top:8px">`).join('')}`)+`</div>`;return h}
const tg=id=>{X=X===id?null:id;render()};
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
async function fin(id){const t=S.trades.find(x=>x.id===id),res=$('#r-res').value,ex=$('#r-r').value,note=$('#r-note').value,fl=[...$('#r-img').files].slice(0,3);t.shots=(await Promise.all(fl.map(shrink))).filter(Boolean);t.status='closed';t.ct=Date.now();t.result=res;t.r=ex!==''?+ex:res==='win'?+t.rr.toFixed(2):res==='loss'?-1:0;t.note=note;X=null;save();render();toast('Trade closed')}
function jrn(){let h=`<div class="tabs"><button class="btn ${jv==='pills'?'on':''}" onclick="jv='pills';render()">Pills</button><button class="btn ${jv==='cal'?'on':''}" onclick="jv='cal';render()">Calendar</button></div>`;
 if(!S.trades.length)return h+'<div class="card"><p>No trades yet. Plan one in the Planner and send it here.</p></div>';
 if(jv==='pills'){const sl=(k,lab,o)=>`<select onchange="FL.${k}=this.value;render()" style="width:auto;margin:0" aria-label="${lab}"><option value="">${lab}</option>${o.map(x=>`<option value="${x[0]}" ${FL[k]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
 const l=S.trades.filter(t=>(!FL.m||t.model===FL.m)&&(!FL.s||t.session===FL.s)&&(!FL.r||(FL.r==='open'?t.status==='open':t.result===FL.r))).sort((a,b)=>b.ts-a.ts);
 return h+`<div class="tabs">${sl('m','All models',models().map(m=>[m.id,m.name]))}${sl('s','All sessions',Object.entries(SN))}${sl('r','All results',[['open','Pending'],['win','Win'],['loss','Loss'],['be','Break even']])}</div>`+(l.map(pill).join('')||'<p class="mu">No trades match these filters.</p>')}
 const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),by={};S.trades.forEach(t=>(by[dkey(t.ts)]=by[dkey(t.ts)]||[]).push(t));
 h+=`<div class="card"><div class="tabs"><button class="btn" onclick="cm=new Date(${y},${m-1},1);render()">‹</button><b style="min-width:150px;text-align:center">${cm.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn" onclick="cm=new Date(${y},${m+1},1);render()">›</button></div><div class="cal">`+DN.map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
 for(let d=1;d<=days;d++){const k=y+'-'+m+'-'+d,l=by[k]||[],c=l.filter(t=>t.status==='closed'),r=c.reduce((a,t)=>a+t.r,0),op=l.some(t=>t.status==='open');
  h+=`<div class="day ${c.length?(r>0?'w':r<0?'l':''):''} ${op?'o':''} ${sel===k?'sel':''}" onclick="sel='${k}';render()">${d}${c.length?`<div class="num">${fr(r)}</div>`:''}${op?'<div class="mu">pending</div>':''}</div>`}
 h+='</div></div>';if(sel&&by[sel])h+=by[sel].map(pill).join('');return h}
function plan(){const opt=models().map(m=>`<option value="${m.id}" ${P.model===m.id?'selected':''}>${esc(m.name)}</option>`).join('');
 return`<div class="g2"><div class="card"><h3>Trade setup</h3><label>Account<select id="f-acc" onchange="U();render()"><option value="">No account</option>${S.accounts.map(a=>`<option value="${a.id}" ${P.acc===a.id?'selected':''}>${esc(a.label)}</option>`).join('')}</select></label><label>Instrument<input id="f-sym" list="ins" value="${P.sym}" oninput="U()"></label><datalist id="ins">${INS.map(i=>`<option value="${i[0]}">`).join('')}</datalist><label>Entry model<select id="f-model" onchange="U()">${opt}</select></label>
 <div class="g3"><label>Entry<input id="f-entry" type="number" step="any" value="${P.entry}" oninput="U()"></label><label>Stop loss<input id="f-sl" type="number" step="any" value="${P.sl}" oninput="U()"></label><label>Take profit<input id="f-tp" type="number" step="any" value="${P.tp}" oninput="U()"></label></div>
 <label>Risk % of $${Math.round(P.acc&&AI(P.acc)?AI(P.acc).bal:S.bal).toLocaleString()} balance<input id="f-risk" type="number" step="0.05" value="${P.risk}" oninput="U()"></label></div><div class="card"><h3>Computed for you</h3><div id="out">${outHTML()}</div></div></div>`}
function ana(){const c=closed();if(!c.length)return`<div class="card"><p>Analytics count closed trades only. Close a trade in the Journal, or load sample data in Settings.</p></div>`;
 const s=c.slice().sort((a,b)=>a.ts-b.ts);let cum=0;const pts=[[0,0]].concat(s.map((t,i)=>[i+1,cum+=t.r])),mn=Math.min(...pts.map(p=>p[1]),0),mx=Math.max(...pts.map(p=>p[1]),.5),X0=i=>10+i/(pts.length-1||1)*580,Y0=v=>190-(v-mn)/(mx-mn||1)*170;
 const g=(keys,f)=>keys.map(k=>[k[1],c.filter(t=>f(t)===k[0])]);
