<html lang="en" data-theme="obsidian"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Desk — redesigned preview</title>
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root,[data-theme=obsidian]{--bg:#08090b;--wash:radial-gradient(circle at 82% -12%,#242019 0,#0b0c0f 36%,#08090b 72%);--p:#111318;--p2:#17191f;--in:#0a0b0e;--ln:#292c33;--tx:#ece9e2;--mu:#8d9098;--g:#c9a96a;--g2:#e3c88d;--gf:#b49359;--gt:#050505;--w:#71c79a;--wb:#102019;--wl:#397353;--l:#df7777;--lb:#201112;--ll:#713b3b;--info:#7ca9c9;--ib:#0e1820;--il:#304e63;--num:Inter,system-ui,sans-serif}
[data-theme=ivory]{--bg:#f7f3ec;--wash:none;--p:#efebe3;--p2:#e6e1d6;--in:#fbf9f4;--ln:#d6cfc1;--tx:#23211e;--mu:#6d685e;--g:#9c7a35;--g2:#7d5f22;--gf:#a8853d;--gt:#fff;--w:#3d8560;--wb:#e3efe7;--wl:#9cc5ae;--l:#b45555;--lb:#f3e2e0;--ll:#d9a7a3;--info:#3d6f91;--ib:#e2edf3;--il:#9eb8c9;--num:Inter,system-ui,sans-serif}
[data-theme=terminal]{--bg:#000;--wash:none;--p:#0b0b0b;--p2:#161616;--in:#000;--ln:#333;--tx:#fff;--mu:#999;--g:#fff;--g2:#fff;--gf:#fff;--gt:#000;--w:#86d6a9;--wb:#101a14;--wl:#86d6a9;--l:#e58b8b;--lb:#190e0e;--ll:#e58b8b;--info:#9dc7e4;--ib:#0c1116;--il:#9dc7e4;--num:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg) var(--wash);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.side{position:fixed;inset:0 auto 0 0;width:246px;background:var(--in);border-right:1px solid var(--ln);padding:22px 16px;display:flex;flex-direction:column;gap:21px;z-index:5}.brand{position:relative;--a:0deg}.brand::before,.brand::after{content:"";position:absolute;inset:-1px;border-radius:16px;background:conic-gradient(from var(--a),transparent 0 54%,var(--g) 80%,#fff6dc 92%,transparent);animation:orbit 4s linear infinite}.brand::before{filter:blur(10px);opacity:.78;inset:-3px}.brand::after{padding:1.5px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}.bin{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:12px;background:var(--in);border-radius:15px}.bin svg{flex:none}.name,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}.name{font-size:19px;line-height:1.05}.sub{font-size:11px;color:var(--mu);margin-top:3px}@keyframes orbit{to{--a:360deg}}@media(prefers-reduced-motion:reduce){.brand::before,.brand::after{animation:none}}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:9px;color:var(--mu);display:flex;align-items:center;justify-content:space-between}nav button:hover,nav button.on{color:var(--g);background:var(--p2)}nav button small{font-size:10px;color:inherit;opacity:.75}.side-foot{margin-top:auto;border-top:1px solid var(--ln);padding:13px 10px 0}.connection{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--w)}.dot{width:7px;height:7px;border-radius:50%;background:var(--w);box-shadow:0 0 10px var(--w)}.mini-clock{display:flex;justify-content:space-between;margin-top:8px;font:11px var(--num);color:var(--mu)}
main{margin-left:246px;padding:28px;max-width:1540px}h1{font-size:31px}h2{font-size:21px}h3{font-size:17px;margin-bottom:10px}.hd{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px;gap:15px;flex-wrap:wrap}.hd p{margin:4px 0 0;color:var(--mu)}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--g);font-weight:650;margin-bottom:5px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card{background:var(--p);border:1px solid var(--ln);border-radius:13px;padding:18px;margin-bottom:16px}.g2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.g2.equal{grid-template-columns:1fr 1fr}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.btn{cursor:pointer;background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 14px}.btn:hover{border-color:var(--g)}.btn.pri{background:var(--gf);color:var(--gt);border-color:var(--gf);font-weight:650}.btn.link{background:transparent}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}.num{font-family:var(--num);font-variant-numeric:tabular-nums}.mu{color:var(--mu)}.tiny{font-size:11px}.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mu)}.stat{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:12px}.stat small{color:var(--mu);font-size:11px}.stat b{display:block;font-size:22px;font-family:var(--num);font-weight:600;margin:2px 0}.stat em{font-style:normal;font-size:11px;color:var(--mu)}
.pill{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--p);margin-bottom:8px;cursor:pointer}.pill:hover{background:var(--p2)}.pill em{margin-left:auto;font-style:normal;font-weight:650}.pill.wn{background:var(--wb);border-color:var(--wl)}.pill.wn em{color:var(--w)}.pill.ls{background:var(--lb);border-color:var(--ll)}.pill.ls em{color:var(--l)}.pill.op{border-style:dashed;border-color:var(--g)}.pill.op em{color:var(--g)}.pill.info{background:var(--ib);border-color:var(--il)}.pill.info em{color:var(--info)}.symbol{width:34px;height:34px;border:1px solid var(--ln);border-radius:9px;background:var(--in);display:grid;place-items:center;color:var(--g2);font:bold 11px var(--num);flex:none}.market-main{min-width:130px}.market-main b{display:block}.market-main span{display:block;color:var(--mu);font-size:11px}.evidence{flex:1;color:var(--mu);font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:12px;border:1px solid var(--ln);font-size:10px;letter-spacing:.04em}.badge.w{color:var(--w);border-color:var(--wl);background:var(--wb)}.badge.l{color:var(--l);border-color:var(--ll);background:var(--lb)}.badge.g{color:var(--g2);border-color:#5b4a2c;background:#1b1710}.badge.i{color:var(--info);border-color:var(--il);background:var(--ib)}
.thesis{border-left:2px solid var(--g);padding-left:13px;margin:12px 0 17px;color:#d9d5ce}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--ln)}.row span:first-child{color:var(--mu)}.row strong{text-align:right;font-weight:600}.status{padding:12px 14px;border-radius:10px;background:var(--wb);border:1px solid var(--wl);display:flex;justify-content:space-between;align-items:center;margin:13px 0}.status b{color:var(--w)}.status.warn{background:#1d180e;border-color:#5b4a2c}.status.warn b{color:var(--g2)}.score{display:grid;grid-template-columns:105px 1fr 26px;gap:9px;align-items:center;margin:10px 0;font-size:12px}.pb{height:7px;border-radius:4px;background:var(--in);border:1px solid var(--ln);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--gf),var(--g2));border-radius:4px}.checklist{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.step{border:1px solid var(--ln);border-radius:9px;padding:8px;background:var(--in);font-size:11px;color:var(--mu)}.step.done{border-color:var(--wl);color:var(--w);background:var(--wb)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}input,select,textarea{width:100%;margin-top:4px;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px 10px}input:focus,select:focus,textarea:focus{border-color:var(--g);outline:0}.form3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.computed{min-height:391px}.calcgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.calc{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:11px}.calc small{display:block;color:var(--mu)}.calc b{display:block;margin-top:3px;font:600 17px var(--num)}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);text-align:left;font-weight:500}td,th{padding:10px 7px;border-bottom:1px solid var(--ln)}.chart{height:265px;border:1px solid var(--ln);border-radius:10px;background:repeating-linear-gradient(0deg,transparent 0,transparent 52px,rgba(141,144,152,.08) 53px),repeating-linear-gradient(90deg,transparent 0,transparent 78px,rgba(141,144,152,.06) 79px),var(--in);position:relative;overflow:hidden}.chart svg{position:absolute;inset:0;width:100%;height:100%}.zone{position:absolute;left:14%;right:8%;bottom:22%;height:44px;background:rgba(113,199,154,.09);border:1px solid rgba(113,199,154,.35);color:var(--w);font-size:10px;padding:6px 9px}.chart-note{position:absolute;top:12px;right:12px;background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:7px 9px;font-size:11px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs .btn.on{border-color:var(--g);color:var(--g)}.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kcol{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:155px}.kcol h4{margin:0 0 9px;color:var(--mu);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.kitem{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:9px;margin:7px 0}.kitem small{display:block;color:var(--mu);margin-top:4px}.alert{display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}.clockbox{background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:11px}.clockbox small{color:var(--mu)}.clockbox b{display:block;font:600 18px var(--num)}.empty{border:1px dashed var(--g);border-radius:12px;padding:28px;text-align:center;color:var(--mu)}#toast{position:fixed;bottom:20px;right:20px;background:var(--gf);color:var(--gt);padding:10px 16px;border-radius:9px;font-weight:650;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}#toast.on{opacity:1}
@media(max-width:980px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.side{position:static;width:auto;border-right:0;border-bottom:1px solid var(--ln)}nav{flex-direction:row;overflow:auto}.side-foot{display:none}main{margin:0;padding:16px}.g2,.g3,.g4,.form3{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.checklist{grid-template-columns:1fr 1fr}}
</style></head><body>
<aside class="side">
 <div class="brand"><div class="bin">

</aside>

<script>
const $=s=>document.querySelector(s), toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('on'),2600)};
const clock=()=>{const d=new Date(),f=z=>new Intl.DateTimeFormat('en-GB',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);[['#ny','America/New_York'],['#sa','Africa/Johannesburg'],['#lo','Europe/London']].forEach(([i,z])=>{const e=$(i);if(e)e.textContent=f(z)})};setInterval(clock,1000);clock();
const head=(title,sub,ey='Decision workspace',actions='')=>`<div class="hd"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
const spark=(c='var(--w)')=>`<svg width="76" height="25" viewBox="0 0 76 25" aria-hidden="true"><polyline points="1,21 10,18 17,20 25,11 34,16 43,7 52,12 61,5 69,8 75,2" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
function radar(){return head('Swing Radar','The clearest paths first. Every status is backed by visible evidence.','Market → thesis → plan → review','<button class="btn" onclick="toast(\'Discovery refreshed from MT5\')">Refresh</button><button class="btn pri" onclick="go(\'plans\')">New thesis</button>')+`<div class="g2"><section class="card"><h3>Market opportunities</h3><div class="pill wn" onclick="go('markets')"><div class="symbol">EU</div><div class="market-main"><b>EUR / USD</b><span>EURUSD.a · D1/H4</span></div><span class="badge w">LONG</span><div class="evidence">HH · HL · discount · fresh D1 demand</div>${spark()}<em>WAIT</em></div><div class="pill ls" onclick="go('markets')"><div class="symbol">AU</div><div class="market-main"><b>Gold / USD</b><span>XAUUSDm · D1/H1</span></div><span class="badge l">SHORT</span><div class="evidence">LH · LL · premium · order block</div>${spark('var(--l)')}<em>WATCH</em></div><div class="pill info" onclick="go('markets')"><div class="symbol">DA</div><div class="market-main"><b>DAX / EUR</b><span>GER40 · H4/H1</span></div><span class="badge i">LONG</span><div class="evidence">reclaim · CRT · sell-side sweep</div>${spark('var(--info)')}<em>WATCH</em></div><p class="mu tiny">Ordered by transparent structure, location, liquidity, zone, macro and timing evidence — not an opaque AI score.</p></section><section class="card"><div class="eyebrow">Active thesis · EUR / USD</div><h2>Bullish continuation from D1 demand</h2><div class="thesis">Your idea is valid. Your timing isn't here yet.</div><div class="row"><span>Why</span><strong>W1 + D1 bullish · fresh demand</strong></div><div class="row"><span>Entry area</span><strong class="num">1.08240 — 1.08410</strong></div><div class="row"><span>Invalidation</span><strong class="num">1.07820</strong></div><div class="row"><span>Targets</span><strong class="num">1.09360 · 1.10120</strong></div><div class="status warn"><div><b>WAITING FOR RETRACEMENT</b><div class="tiny mu">71% band + reaction + NY window</div></div><strong class="num">01:47:22</strong></div><button class="btn pri" style="width:100%" onclick="go('plans')">Open planner</button></section></div><div class="g4"><div class="stat"><small>Markets scanned</small><b>42</b><em>MT5 discovery</em></div><div class="stat"><small>Active thesis</small><b>01</b><em>waiting, not forcing</em></div><div class="stat"><small>Next event</small><b style="font-size:16px">ECB · Thu 14:15</b><em>dual-clock calendar</em></div><div class="stat"><small>NY window</small><b style="font-size:16px;color:var(--w)">ACTIVE</b><em class="num">01:47:22 remaining</em></div></div><div class="g2 equal" style="margin-top:16px"><section class="card"><h3>Swing scorecard</h3>${[['STRUCTURE',92],['LOCATION',84],['LIQUIDITY',77],['ZONE',86],['MACRO',38],['TIMING',74]].map(x=>`<div class="score"><span>${x[0]}</span><div class="pb"><i style="width:${x[1]}%"></i></div><b>${x[0]==='MACRO'?'?':x[1]}</b></div>`).join('')}</section><section class="card"><h3>You are here</h3><div class="checklist"><div class="step done">✓ HTF bias</div><div class="step done">✓ Structure</div><div class="step done">✓ Location</div><div class="step done">✓ Zone</div><div class="step">○ Retracement</div><div class="step">○ Confirmation</div><div class="step">○ Execution</div><div class="step">○ Review</div></div><div class="status"><div><b>NEW YORK WINDOW ACTIVE</b><div class="tiny mu">08:30–11:30 America/New_York</div></div><strong class="num">01:47:22</strong></div></section></div>`}
function markets(){return head('EUR / USD','Canonical market · broker symbol EURUSD.a · timeframe roles discovered from MT5.','Instrument evidence','<button class="btn" onclick="toast(\'Evidence layer toggled\')">Layers</button><button class="btn pri" onclick="go(\'plans\')">Build plan</button>')+`<div class="g2"><section class="card"><h3>Chart as evidence</h3><div class="chart"><svg viewBox="0 0 800 260" preserveAspectRatio="none"><polyline points="0,211 62,198 110,205 154,163 204,181 251,136 302,152 354,112 412,133 468,88 526,104 579,55 638,79 698,39 760,63 800,26" fill="none" stroke="var(--g2)" stroke-width="3" vector-effect="non-scaling-stroke"/><line x1="0" y1="104" x2="800" y2="104" stroke="var(--g)" stroke-dasharray="5 5" opacity=".5"/></svg><div class="zone">D1 DEMAND · Engine B · fresh · proximal 1.08410</div><div class="chart-note"><b class="num">1.08620</b><div class="tiny mu">current price</div></div></div><p class="mu tiny">Hover labels identify the engine that produced each line, zone or level.</p></section><section class="card"><h3>Evidence stack</h3><div class="pill wn"><b>W1 bias</b><span>Close above prior weekly high</span><em>BULLISH</em></div><div class="pill wn"><b>D1 structure</b><span>Higher high · higher low</span><em>ALIGNED</em></div><div class="pill op"><b>Demand</b><span>Base → impulsive departure</span><em>FRESH</em></div><div class="pill info"><b>Liquidity</b><span>Prior-week high + equal highs</span><em>ABOVE</em></div><div class="pill"><b>Macro</b><span>Provider not connected</span><em class="mu">?</em></div><div class="status warn"><div><b>STATUS: WAIT</b><div class="tiny mu">No order is sent from evidence view.</div></div><span class="badge g">VALID IDEA</span></div></section></div>`}
function plans(){return head('Planner','Plan the trade before you take it.','Thesis → risk → pre-flight','<button class="btn" onclick="toast(\'Plan saved as draft\')">Save draft</button><button class="btn pri" onclick="toast(\'Broker order_check required before dispatch\')">Run pre-flight</button>')+`<div class="g2 equal"><section class="card"><h3>Trade setup</h3><label>Broker account<select><option>Broker Demo · 12345678</option></select></label><label>Instrument<input value="EURUSD.a — EUR / USD"></label><label>Setup engine<select><option>Structure + Supply/Demand + FVG + 71%</option><option>CRT + Liquidity</option><option>Signature · owner-confirm</option></select></label><div class="form3"><label>Entry<input value="1.08310"></label><label>Stop loss<input value="1.07810"></label><label>Take profit<input value="1.09910"></label></div><label>Risk % of $10,000 balance<input type="number" value="1.0" step="0.1"></label><label>Thesis<textarea rows="3">W1 and D1 bullish. Wait for retracement into fresh D1 demand during the New York setup window.</textarea></label></section><section class="card computed"><h3>Computed for you</h3><p class="mu">Position size is derived from the broker's contract specification and must still pass order_check.</p><div class="calcgrid"><div class="calc"><small>Max loss</small><b>$100.00</b></div><div class="calc"><small>Position size</small><b>0.20 lots</b></div><div class="calc"><small>Stop distance</small><b>500 ticks</b></div><div class="calc"><small>Expected R</small><b>3.20R</b></div><div class="calc"><small>Margin required</small><b>$216.62</b></div><div class="calc"><small>Margin after</small><b>$9,424.18</b></div></div><div class="status"><div><b>CONTRACT CHECKS READY</b><div class="tiny mu">volume step · stops level · fill mode · margin</div></div><span class="badge w">VALID</span></div><button class="btn pri" style="width:100%" onclick="toast('Pre-flight opened — nothing sent')">Continue to broker validation</button></section></div><section class="card"><h3>Lifecycle</h3><div class="kanban"><div class="kcol"><h4>Watching · 2</h4><div class="kitem">Gold / USD<small>premium · OB · NY upcoming</small></div><div class="kitem">DAX / EUR<small>CRT sweep · retest pending</small></div></div><div class="kcol"><h4>Thesis · 1</h4><div class="kitem">EUR / USD<small>W1 + D1 aligned</small></div></div><div class="kcol"><h4>Waiting · 1</h4><div class="kitem">EUR / USD<small>71% · reaction · window</small></div></div><div class="kcol"><h4>Open · 2</h4><div class="kitem">GBP / JPY<small>+1.8R · intact</small></div><div class="kitem">Gold / USD<small>-0.3R · damaged</small></div></div><div class="kcol"><h4>Review · 7</h4><div class="kitem">Last week<small>5W · 2L · +0.8R avg</small></div></div></div></section>`}
